# Alembic configuration for the expense-tracker backend (t5).
#
# The database URL is NOT configured here: `alembic/env.py` resolves it
# from the app Settings (env var > .env > default, REQ-ARCH-061), so a
# caller-provided DATABASE_URL always wins and nothing is hardcoded.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Intentionally empty; env.py supplies the URL from app settings.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
