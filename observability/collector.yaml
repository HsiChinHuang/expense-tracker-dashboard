# observability/collector.yaml - the OTel collector configuration.
#
# This file IS ENABLED AND MOUNTED: the otel-collector service in
# observability/compose.yaml mounts it as its live collector configuration
# (./collector.yaml:/etc/otelcol-contrib/config.yaml:ro). Starting that
# compose file starts a collector reading this config; the traces pipeline
# below receives OTLP spans and exports them to the in-cluster Tempo
# service at tempo:4317 (never scheme-qualified) and to a local file.
#
# The API side that produces those spans is backend/app/trace.py: one
# SERVER span per request whose 32-hex trace id the correlated log lines
# carry (ops/logging.md). The measured journey is recorded in
# docs/criteria/trace_correlation_verification.md.
#
# Endpoints are loopback-only or in-cluster service names, no credential
# appears anywhere in this file, and no cloud or hosted endpoint is named;
# render.yaml deploys none of this stack. The scrape-and-alert metrics path
# (prometheus + alertmanager + grafana) works without this file.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 2s
    limit_mib: 256
    spike_limit_mib: 64

exporters:
  # Fan out to the same loopback Prometheus that scrapes the API. The
  # metric names it receives are the t76 inventory in
  # observability/alerts.yaml; this file declares none of its own.
  prometheus:
    endpoint: 127.0.0.1:8889
    send_timestamps: true
    metric_expiration: 10m
  otlp/tempo:
    # In-cluster service name, never scheme-qualified (leg 271's
    # non-local-URL scan fires on an http:// scheme form).
    endpoint: tempo:4317
    tls:
      insecure: true
  file:
    path: ./otel-received.json

extensions:
  health_check:
    endpoint: 127.0.0.1:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, file]
