# Observability stack for THIS repo (phase_13, criterion 13; REQ-OPS-083
# realised rather than deferred). This is a SECOND, separate compose file:
# the app stack in docker-compose.yml is FROZEN and is not touched here.
# Exactly six services are enabled: prometheus (metrics scrape and rule
# evaluation), alertmanager (alert routing), grafana (visualisation) and,
# since t122, the OTel collector / Loki / Tempo traces-and-logs block.
# The collector, Loki and Tempo services carry NO host:container mapping:
# their port list is container-only (unpublished) so the published host
# band stays exactly 9090 / 9093 / 3000 as pinned below.
# Port band pinned once in docs/plan.md: 9090 / 9093 / 3000, mapped in
# HOST:CONTAINER equal form. It collides with neither 8001 (the recorded
# alternate Docker-stack mapping) nor 8137 (the pinned local verification
# endpoint), nor 8000 / 5173 / 18137. All credentials below are local
# placeholders in the merged change-me-locally style; no real secret and
# no cloud endpoint appears anywhere in this file.

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      # t76 owns observability/prometheus.yml and observability/alerts.yaml;
      # this skeleton only fixes the mount point they will attach to.
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: change-me-locally
    ports:
      - "3000:3000"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    # Why this service exists: it receives the trace spans the API
    # produces and fans them out - the traces half of the block. It
    # mounts observability/collector.yaml as its live configuration.
    # Container-only ports (no HOST:CONTAINER pair): nothing is published
    # to the host, so the pinned 9090 / 9093 / 3000 band stays untouched.
    ports:
      - "4317"
      - "4318"
    volumes:
      - ./collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  loki:
    image: grafana/loki:3.1.0
    # Why this service exists: logs aggregation the operator can query -
    # the logs half of the block. Container-only ports, never published.
    ports:
      - "3100"

  tempo:
    image: grafana/tempo:2.5.0
    # Why this service exists: trace storage and query alongside the
    # collector. Container-only ports, never published.
    ports:
      - "4317"
