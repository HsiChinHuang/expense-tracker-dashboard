# E2E pipeline (REQ-TECH-050, REQ-CICD-012): runs ONLY on pushes to main
# (REQ-CICD-015 - never on pull requests). Brings up the t24 compose stack,
# waits for the health endpoint, installs Playwright browsers, runs the
# suite through make e2e, uploads the report on failure, tears the stack down.
name: E2E

on:
  push:
    branches: [main]

# Least-privilege token for the whole workflow (REQ-CICD-071).
permissions:
  contents: read

# Newest main push wins; superseded runs are cancelled (REQ-CICD-016).
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up Node with npm cache
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@v4.1.2
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ github.sha }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Start the compose stack
        run: docker compose up -d --build
      - name: Wait for the health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health; then
              exit 0
            fi
            sleep 2
          done
          echo "health endpoint never turned ok"
          exit 1
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run the E2E suite
        run: make e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
      - name: Stop the compose stack
        if: always()
        run: docker compose down
