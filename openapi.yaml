# Provenance: generated file - do not hand-edit.
# Exported from the merged FastAPI app (app.openapi()) via:
#   cd backend && uv run python -c "import yaml;from app.main import app;print(yaml.safe_dump(app.openapi(), sort_keys=True, width=4096))"
# Regenerate with the same recipe after any router change (REQ-DOC-014).
# The committed content below is the byte output of that recipe.
components:
  schemas:
    BudgetResponse:
      description: "Public budget representation \u2014 exactly two fields (REQ-API-050).\n\nAttributes:\n    year_month: The ``YYYY-MM`` path echo (never a date object).\n    amount: 2-decimal string form of the Decimal (REQ-SEC-050);\n        ``\"0.00\"`` for a well-formed but absent month."
      properties:
        amount:
          title: Amount
          type: string
        year_month:
          title: Year Month
          type: string
      required:
      - year_month
      - amount
      title: BudgetResponse
      type: object
    CategoryListResponse:
      description: "Response body for ``GET /api/v1/categories`` (REQ-API-030).\n\nThe object wrapper is contractual (Chapter 7 section 7.4.1); a bare\narray would break t16's mirrored client type.\n\nAttributes:\n    categories: Visible categories, system block first then the\n        caller's custom ones, alphabetical inside each block."
      properties:
        categories:
          items:
            $ref: '#/components/schemas/CategoryResponse'
          title: Categories
          type: array
      required:
      - categories
      title: CategoryListResponse
      type: object
    CategoryResponse:
      description: "Public category representation \u2014 exactly six fields (REQ-API-030).\n\n``from_attributes`` lets routes build it from the ORM ``Category``\nrow; the model deliberately has no ``user_id`` field so ownership can\nnever leak through the API.\n\nAttributes:\n    id: Category UUID (serialized as its canonical string form).\n    name: Stored category name.\n    color: Stored HEX color.\n    icon: Icon identifier, or ``None``.\n    is_system: True for the ten seeded system categories.\n    created_at: Creation timestamp."
      properties:
        color:
          title: Color
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        icon:
          anyOf:
          - type: string
          - type: 'null'
          title: Icon
        id:
          format: uuid
          title: Id
          type: string
        is_system:
          title: Is System
          type: boolean
        name:
          title: Name
          type: string
      required:
      - id
      - name
      - color
      - icon
      - is_system
      - created_at
      title: CategoryResponse
      type: object
    CreateCategoryRequest:
      description: "Request body for ``POST /api/v1/categories`` (REQ-API-031).\n\nAttributes:\n    name: Category name, 1-100 characters (W4: Pydantic-owned bound).\n    color: HEX color such as ``#EF4444`` (case-insensitive hex digits).\n    icon: Optional icon identifier, at most 50 characters."
      properties:
        color:
          pattern: ^#[0-9A-Fa-f]{6}$
          title: Color
          type: string
        icon:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          title: Icon
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
      required:
      - name
      - color
      title: CreateCategoryRequest
      type: object
    CreateExpenseRequest:
      additionalProperties: false
      description: "Request body for ``POST /api/v1/expenses`` (REQ-API-041).\n\nAttributes:\n    amount: Decimal-string such as \"125.50\" (chapter pattern; the\n        value rules live in the service so the error code is\n        INVALID_AMOUNT).\n    category_id: Category the expense belongs to.\n    date: Calendar date, no timezone.\n    note: Optional free text, at most 500 characters."
      properties:
        amount:
          title: Amount
          type: string
        category_id:
          format: uuid
          title: Category Id
          type: string
        date:
          format: date
          title: Date
          type: string
        note:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Note
      required:
      - amount
      - category_id
      - date
      title: CreateExpenseRequest
      type: object
    DashboardRecentResponse:
      description: "``GET /api/v1/dashboard/recent`` body (Chapter 7 7.7.6).\n\nAttributes:\n    items: Recent expenses in the merged ten-key expense shape\n        (groom ruling 7 \u2014 the very same ``ExpenseResponse`` the\n        expenses router serves)."
      properties:
        items:
          items:
            $ref: '#/components/schemas/ExpenseResponse'
          title: Items
          type: array
      required:
      - items
      title: DashboardRecentResponse
      type: object
    ExpenseListResponse:
      description: "Response body for ``GET /api/v1/expenses`` \u2014 the W6 envelope.\n\nExactly the four Chapter 7 7.5.1 keys; adding or renaming a key is a\ncontract break for t16.\n\nAttributes:\n    items: One page of expenses in date DESC, created_at DESC order.\n    total: Total number of matching rows across all pages.\n    page: The page that was returned (1-based).\n    page_size: Requested page size."
      properties:
        items:
          items:
            $ref: '#/components/schemas/ExpenseResponse'
          title: Items
          type: array
        page:
          title: Page
          type: integer
        page_size:
          title: Page Size
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - page
      - page_size
      title: ExpenseListResponse
      type: object
    ExpenseResponse:
      description: "Public expense representation \u2014 exactly ten fields (REQ-API-040).\n\nAttributes:\n    id: Expense UUID (canonical string on the wire).\n    amount: 2-decimal string form of the Decimal (REQ-SEC-050).\n    currency: Always \"USD\" (ck_expenses_currency_usd).\n    category_id: Owning category UUID string.\n    category_name: Denormalized name from the joined category.\n    category_color: Denormalized HEX color from the category.\n    date: Calendar date (serializes as YYYY-MM-DD).\n    note: Free text or None.\n    created_at: Creation timestamp.\n    updated_at: Last-update timestamp."
      properties:
        amount:
          title: Amount
          type: string
        category_color:
          title: Category Color
          type: string
        category_id:
          format: uuid
          title: Category Id
          type: string
        category_name:
          title: Category Name
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        currency:
          title: Currency
          type: string
        date:
          format: date
          title: Date
          type: string
        id:
          format: uuid
          title: Id
          type: string
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - amount
      - currency
      - category_id
      - category_name
      - category_color
      - date
      - note
      - created_at
      - updated_at
      title: ExpenseResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthResponse:
      description: "Response body for ``GET /api/v1/health``.\n\nAttributes:\n    status: Overall service health; ``\"ok\"`` when healthy and no\n        fallback is active, ``\"degraded\"`` otherwise.\n    database: Configured database backend name.\n    fallback_active: Whether the SQLite fallback is currently active.\n    version: Application version string served by the API."
      properties:
        database:
          enum:
          - postgresql
          - sqlite
          title: Database
          type: string
        fallback_active:
          title: Fallback Active
          type: boolean
        status:
          enum:
          - ok
          - degraded
          title: Status
          type: string
        version:
          title: Version
          type: string
      required:
      - status
      - database
      - fallback_active
      - version
      title: HealthResponse
      type: object
    LoginRequest:
      description: "Request body for ``POST /api/v1/auth/login`` (REQ-API-021).\n\nAttributes:\n    email: Account email (matched case-insensitively by the service).\n    password: Candidate plaintext password."
      properties:
        email:
          maxLength: 255
          minLength: 3
          title: Email
          type: string
        password:
          minLength: 1
          title: Password
          type: string
      required:
      - email
      - password
      title: LoginRequest
      type: object
    LoginResponse:
      description: "Response body for ``POST /api/v1/auth/login`` (REQ-API-021).\n\nAttributes:\n    access_token: Signed 24-hour JWT.\n    token_type: Always ``\"bearer\"``.\n    user: The authenticated user's public representation."
      properties:
        access_token:
          title: Access Token
          type: string
        token_type:
          default: bearer
          title: Token Type
          type: string
        user:
          $ref: '#/components/schemas/UserResponse'
      required:
      - access_token
      - user
      title: LoginResponse
      type: object
    RegisterRequest:
      description: "Request body for ``POST /api/v1/auth/register`` (REQ-API-020).\n\nAttributes:\n    email: Candidate email; normalized to lowercase by the service.\n    username: Candidate username (uniqueness is case-sensitive).\n    password: Plaintext password; validated then bcrypt-hashed."
      properties:
        email:
          maxLength: 255
          minLength: 3
          title: Email
          type: string
        password:
          title: Password
          type: string
        username:
          title: Username
          type: string
      required:
      - email
      - username
      - password
      title: RegisterRequest
      type: object
    SetBudgetRequest:
      additionalProperties: false
      description: "Request body for ``PUT /api/v1/budgets/{year_month}`` (REQ-API-051).\n\nAttributes:\n    amount: Decimal-string such as \"2000.00\"; the VALUE rules live\n        in the service so the error code is INVALID_AMOUNT (the\n        chapter pattern is deliberately not enforced here \u2014 see the\n        module docstring and the t13 precedent)."
      properties:
        amount:
          title: Amount
          type: string
      required:
      - amount
      title: SetBudgetRequest
      type: object
    UpdateExpenseRequest:
      additionalProperties: false
      description: "Request body for ``PUT /api/v1/expenses/{id}`` (REQ-API-043).\n\nEvery field is optional (Chapter 7 7.5.4) but at least one must be\npresent; the router rejects an all-absent body with 422 before the\nservice is reached.\n\nAttributes:\n    amount: Replacement amount string (same rules as create).\n    category_id: Replacement category (re-validated by the service).\n    date: Replacement calendar date.\n    note: Replacement note (None clears it when explicitly sent)."
      properties:
        amount:
          anyOf:
          - type: string
          - type: 'null'
          title: Amount
        category_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Category Id
        date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Date
        note:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Note
      title: UpdateExpenseRequest
      type: object
    UserResponse:
      description: "Public user representation \u2014 exactly five fields (REQ-API-020).\n\n``from_attributes`` lets routes build it from the ORM ``User`` row\nwhile the model itself never carries a password field of any casing.\n\nAttributes:\n    id: User UUID (serialized as its canonical string form).\n    email: Lowercased stored email.\n    username: Stored username.\n    is_active: Account activation flag.\n    created_at: Creation timestamp."
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        email:
          title: Email
          type: string
        id:
          format: uuid
          title: Id
          type: string
        is_active:
          title: Is Active
          type: boolean
        username:
          title: Username
          type: string
      required:
      - id
      - email
      - username
      - is_active
      - created_at
      title: UserResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  title: Expense Tracker Dashboard API
  version: 0.1.0
openapi: 3.1.0
paths:
  /:
    get:
      description: "Serve the skeleton root endpoint.\n\nReturns:\n    dict[str, str]: A static status payload."
      operationId: read_root__get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Read Root  Get
                type: object
          description: Successful Response
      summary: Read Root
  /api/v1/auth/login:
    post:
      description: "Log in and receive a 24-hour access token (FR-AUTH-2, REQ-API-021).\n\nArgs:\n    body: Validated login payload.\n    session: Request-scoped database session.\n\nReturns:\n    LoginResponse: ``{access_token, token_type, user}``.\n\nRaises:\n    AppError: 401 INVALID_CREDENTIALS / USER_INACTIVE."
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Login
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: "Return the current user for a valid bearer token (FR-AUTH-3).\n\nArgs:\n    current_user: User resolved by ``get_current_user``.\n\nReturns:\n    User: The authenticated user (public five fields only)."
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Me
      tags:
      - auth
  /api/v1/auth/register:
    post:
      description: "Register a new account (FR-AUTH-1, REQ-API-020).\n\nArgs:\n    body: Validated register payload.\n    session: Request-scoped database session.\n\nReturns:\n    User: The persisted user (rendered through ``UserResponse``,\n    which exposes only the five public fields).\n\nRaises:\n    AppError: 409 DUPLICATE_EMAIL / DUPLICATE_USERNAME."
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Register
      tags:
      - auth
  /api/v1/budgets/{year_month}:
    delete:
      description: "Delete the caller's budget for one month (REQ-API-052).\n\nArgs:\n    year_month: ``YYYY-MM`` path (pattern-frozen; malformed -> 422).\n    session: Request-scoped database session.\n    current_user: Authenticated caller.\n    client_ip: Best-effort client IP for the audit row.\n\nReturns:\n    None: 204 with an empty body.\n\nRaises:\n    AppError: 404 NOT_FOUND for absent AND foreign months alike\n        (identical bodies, never 403, REQ-SEC-031)."
      operationId: delete_budget_api_v1_budgets__year_month__delete
      parameters:
      - description: Budget month in YYYY-MM form.
        in: path
        name: year_month
        required: true
        schema:
          description: Budget month in YYYY-MM form.
          pattern: ^[0-9]{4}-[0-9]{2}$
          title: Year Month
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete Budget
      tags:
      - budgets
    get:
      description: "Return the caller's budget for one month (REQ-API-050).\n\nA well-formed but absent month \u2014 and any other user's month \u2014 is\nthe 200 ``amount \"0.00\"`` body, NEVER 404 (Chapter 7 7.6.1,\nREQ-BE-081, REQ-SEC-030). Malformed formats are 422 (W8).\n\nArgs:\n    year_month: ``YYYY-MM`` path (pattern-frozen; malformed -> 422).\n    session: Request-scoped database session.\n    current_user: Authenticated caller (queries are scoped to them).\n\nReturns:\n    BudgetResponse: The two-key body with the stored or \"0.00\"\n        amount."
      operationId: get_budget_api_v1_budgets__year_month__get
      parameters:
      - description: Budget month in YYYY-MM form.
        in: path
        name: year_month
        required: true
        schema:
          description: Budget month in YYYY-MM form.
          pattern: ^[0-9]{4}-[0-9]{2}$
          title: Year Month
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Budget
      tags:
      - budgets
    put:
      description: "Set or update the caller's budget for one month (REQ-API-051).\n\nUpsert semantics (REQ-BE-080): the FIRST PUT creates and a second\nPUT REPLACES the amount \u2014 both answer 200, NEVER 201 \u2014 and the\ntable keeps exactly one row per (user, month).\n\nArgs:\n    year_month: ``YYYY-MM`` path (pattern-frozen; malformed -> 422).\n    body: Validated ``{amount}`` payload.\n    session: Request-scoped database session.\n    current_user: Authenticated caller who owns the row.\n    client_ip: Best-effort client IP for the audit row.\n\nReturns:\n    BudgetResponse: The two-key body with the stored amount.\n\nRaises:\n    AppError: 422 INVALID_AMOUNT (field ``amount``) for a bad\n        amount VALUE; nothing persists."
      operationId: set_budget_api_v1_budgets__year_month__put
      parameters:
      - description: Budget month in YYYY-MM form.
        in: path
        name: year_month
        required: true
        schema:
          description: Budget month in YYYY-MM form.
          pattern: ^[0-9]{4}-[0-9]{2}$
          title: Year Month
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBudgetRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Set Budget
      tags:
      - budgets
  /api/v1/categories:
    get:
      description: "List the caller's visible categories (FR-CAT-1, REQ-API-030).\n\nArgs:\n    session: Request-scoped database session.\n    current_user: Authenticated caller.\n\nReturns:\n    CategoryListResponse: ``{\"categories\": [...]}`` with the ten\n    system rows first, then the caller's custom rows, alphabetical\n    inside each block."
      operationId: list_categories_api_v1_categories_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: List Categories
      tags:
      - categories
    post:
      description: "Create a custom category for the caller (FR-CAT-2, REQ-API-031).\n\nArgs:\n    body: Validated create payload (name/color/icon bounds owned by\n        the Pydantic schema per review_plan W4).\n    session: Request-scoped database session.\n    current_user: Authenticated caller who owns the new row.\n\nReturns:\n    Category: The persisted row (six public fields only).\n\nRaises:\n    AppError: 409 DUPLICATE_CATEGORY (field ``name``)."
      operationId: create_category_api_v1_categories_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Create Category
      tags:
      - categories
  /api/v1/categories/{category_id}:
    delete:
      description: "Delete the caller's unused custom category (REQ-API-032).\n\nArgs:\n    category_id: Category uuid (Appendix B field pin).\n    session: Request-scoped database session.\n    current_user: Authenticated caller.\n\nReturns:\n    None: 204 with an empty body.\n\nRaises:\n    AppError: 404 NOT_FOUND / CATEGORY_NOT_FOUND (unknown, cross-user,\n        or system id \u2014 single frozen 404 per review_plan W2), or 409\n        CATEGORY_IN_USE (field ``category_id``)."
      operationId: delete_category_api_v1_categories__category_id__delete
      parameters:
      - in: path
        name: category_id
        required: true
        schema:
          format: uuid
          title: Category Id
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete Category
      tags:
      - categories
  /api/v1/dashboard/by-category:
    get:
      description: "Return the caller's category breakdown for one month (REQ-API-062).\n\nArgs:\n    session: Request-scoped database session.\n    current_user: Authenticated caller.\n    year_month: Required ``YYYY-MM`` query (malformed -> 422).\n\nReturns:\n    dict[str, Any]: ``{year_month, total, categories}`` with the\n        frozen five-key rows ordered amount-descending."
      operationId: get_by_category_api_v1_dashboard_by_category_get
      parameters:
      - description: Month in YYYY-MM form.
        in: query
        name: year_month
        required: true
        schema:
          description: Month in YYYY-MM form.
          pattern: ^[0-9]{4}-[0-9]{2}$
          title: Year Month
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get By Category Api V1 Dashboard By Category Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get By Category
      tags:
      - dashboard
  /api/v1/dashboard/cumulative:
    get:
      description: "Return one cumulative day row per calendar day (REQ-API-064).\n\nArgs:\n    session: Request-scoped database session.\n    current_user: Authenticated caller.\n    year_month: Required ``YYYY-MM`` query (malformed -> 422).\n\nReturns:\n    dict[str, Any]: ``{year_month, budget, days}`` with the frozen\n        ``{date, daily, cumulative}`` day keys."
      operationId: get_cumulative_api_v1_dashboard_cumulative_get
      parameters:
      - description: Month in YYYY-MM form.
        in: query
        name: year_month
        required: true
        schema:
          description: Month in YYYY-MM form.
          pattern: ^[0-9]{4}-[0-9]{2}$
          title: Year Month
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Cumulative Api V1 Dashboard Cumulative Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Cumulative
      tags:
      - dashboard
  /api/v1/dashboard/heatmap:
    get:
      description: "Return Monday-aligned seven-day heatmap rows (REQ-API-065).\n\nArgs:\n    session: Request-scoped database session.\n    current_user: Authenticated caller.\n    weeks: Number of weeks, 1..52, default 12 (Chapter 7 7.7.5;\n        out-of-range or non-integer -> merged 422).\n\nReturns:\n    dict[str, Any]: ``{max_amount, weeks}`` with zero-filled days."
      operationId: get_heatmap_api_v1_dashboard_heatmap_get
      parameters:
      - in: query
        name: weeks
        required: false
        schema:
          default: 12
